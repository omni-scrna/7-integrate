[workspace]
channels = ["conda-forge", "bioconda"]
name = "7-integrate"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
check = "Rscript check.R"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/integrate.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/integrate.yml"

[dependencies]
r-base = ">=4.5"
r-harmony = "*"
bioconductor-rhdf5 = "*"
"r-data.table" = "*"
r-optparse = "*"
r-magrittr = "*"
r-yaml = "*"
r-argparser = "*"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }
